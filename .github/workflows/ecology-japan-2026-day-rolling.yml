name: "Japan 2026 historical-information staleness day-lagged replay"

on:
  push:
    branches: [analysis/2026-day-rolling-staleness-20261117]
    paths:
      - ".github/workflows/ecology-japan-2026-day-rolling.yml"
      - "scripts/ecology_japan_2026_triple_source.py"
      - "scripts/ecology_japan_2026_day_rolling.py"
      - "tests/test_ecology_japan_2026_day_rolling.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posthoc-day-lagged-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Python and public-source download dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.6 'huggingface_hub>=0.30' 'hf_xet>=1.0'
      - name: Test no same-day or future labels in rolling predictors and private ID bridge
        run: |
          PYTHONPATH=scripts python -m unittest discover -s tests -p "test_ecology_japan_2026_day_rolling.py" -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p "test_ecology_japan_2026_triple_source.py" -v
      - name: Source A 2010-2021 transient download
        run: |
          mkdir -p tmp/private
          PYTHONPATH=scripts python -c "from pathlib import Path; from ecology_japan_archive_forward import download; download(Path('tmp/private/old.zip'))"
      - name: Source B historical identity-witness SQLite transient download
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          p=Path(hf_hub_download(repo_id="KBlueLeaf/jp-racing-horse",
              repo_type="dataset", filename="all_races_1990-2025.db",
              local_dir="tmp/private"))
          assert p.is_file() and p.stat().st_size>0
          PY
      - name: Fetch source C immutable JRA HTML-derived CSV (no direct JRA website scraping)
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 150 \
            "https://raw.githubusercontent.com/whitedogk/jra-condition-app/main/jra-results-actual.csv" \
            --output tmp/private/jra-results-actual.csv
          test -s tmp/private/jra-results-actual.csv
      - name: Posthoc 2026 all-same-sample comparison of stale, through-2025 and prior-day histories
        run: |
          PYTHONPATH=scripts python scripts/ecology_japan_2026_day_rolling.py \
            --archive tmp/private/old.zip \
            --sqlite tmp/private/all_races_1990-2025.db \
            --jra-csv tmp/private/jra-results-actual.csv \
            --output tmp/japan-2026-day-rolling-aggregate.json
      - name: Fail closed on original scores, target, source IDs and temporal coverage
        run: |
          python - <<'PY'
          import json
          with open("tmp/japan-2026-day-rolling-aggregate.json",encoding="utf-8") as f:
              j=json.load(f)
          assert j["status"]=="POSTHOC_2026_DAY_LAGGED_SOURCE_C_RECENCY_REPLAY_NOT_CAUSAL"
          q=j["parity"]
          assert (q["locked_focal_rows"],q["locked_focal_horses"],q["locked_focal_races"],q["locked_focal_days"])==(480,232,259,42)
          assert q["locked_B_to_C_pre2025_two_day_horses"]==1945
          assert q["frozen_original_models_reproduced_to_1e8"]
          assert q["reduced_sourceA_family_features_reproduce_original_to_1e10"]
          assert j["historic_sourceC_qa"]["no_same_day_sourceC_result_used"]
          assert j["no_horse_names_ids_race_rows_or_predictions_exported"]
          print("POSTHOC_DAY_ROLLING_ALL_SOURCE_ID_AND_TEMPORAL_PARITY_VERIFIED")
          PY
      - name: Remove all third-party original bytes
        if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-2026-posthoc-day-rolling-aggregate-only
          path: tmp/japan-2026-day-rolling-aggregate.json
          if-no-files-found: warn
          retention-days: 14
