name: KEIBA separate WIN-only next-market secondary lane under missing historical WIDE

on:
  push:
    branches: [analysis/win-only-parallel-market-protocol-20261028]
    paths:
      - 'scripts/keiba_win_only_shadow_lane.py'
      - 'scripts/keiba_win_only_github_receipt.py'
      - 'scripts/keiba_dual_market_lane_audit.py'
      - 'tests/test_keiba_win_only_shadow_lane.py'
      - 'tests/test_keiba_win_only_github_receipt.py'
      - 'tests/test_keiba_dual_market_lane_audit.py'
      - 'docs/betting/win-only-and-full-wide-source-lanes-20261028.md'
      - 'scripts/keiba_week1_licensed_capture_plan.py'
      - '.github/workflows/keiba-win-only-secondary-next-market.yml'
  pull_request:
    paths:
      - 'scripts/keiba_win_only_shadow_lane.py'
      - 'scripts/keiba_win_only_github_receipt.py'
      - 'scripts/keiba_dual_market_lane_audit.py'
      - 'tests/test_keiba_win_only_shadow_lane.py'
      - 'tests/test_keiba_win_only_github_receipt.py'
      - 'tests/test_keiba_dual_market_lane_audit.py'
      - 'docs/betting/win-only-and-full-wide-source-lanes-20261028.md'
      - 'scripts/keiba_week1_licensed_capture_plan.py'
      - '.github/workflows/keiba-win-only-secondary-next-market.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-fake-WIDE-source:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Pre-source future WIN-only full roster, code/content fingerprint and no-horse-outcome audit
        run: |
          python -m compileall -q scripts/keiba_win_only_shadow_lane.py scripts/keiba_win_only_github_receipt.py scripts/keiba_dual_market_lane_audit.py tests/test_keiba_win_only_shadow_lane.py tests/test_keiba_win_only_github_receipt.py tests/test_keiba_dual_market_lane_audit.py
          python -m unittest discover -s tests -p 'test_keiba_win_only_shadow_lane.py' -v
          python -m unittest discover -s tests -p 'test_keiba_win_only_github_receipt.py' -v
          python -m unittest discover -s tests -p 'test_keiba_dual_market_lane_audit.py' -v
          python -m unittest discover -s tests -p 'test_keiba_week1_licensed_capture_plan.py' -v
      - name: Original full WIDE crosspool analysis must remain complete-grid-gated
        run: |
          python -m unittest discover -s tests -p 'test_keiba_operator_winwide_capture.py' -v
          python -m unittest discover -s tests -p 'test_keiba_private_multirace_winwide_shadow.py' -v
      - name: Original source-card and complete chain must remain SHA-bound
        run: |
          python -m unittest discover -s tests -p 'test_keiba_operator_cohort_bundle.py' -v
      - name: Distinguish actual WIDE time-series availability from real-time quotes
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import keiba_win_only_shadow_lane as m; assert len(m.MODEL_NAMES)==6 and 'WIDE' not in m.MODEL_NAMES[0] and m.SCHEMA.endswith('_V1'); print('JRA_VAN_HISTORICAL_WIDE_UNAVAILABLE_SO_WIN_ONLY_SECONDARY_PROTOCOL',True); print('NO_NEW_AUTHENTICATED_FORWARD_JRA_MARKET_TRIAL',True)"
