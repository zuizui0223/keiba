name: Keiba endogenous odds threshold null, smooth and coupled agent audit

on:
  push:
    branches: [analysis/endogenous-market-threshold-null-20261025]
    paths:
      - 'scripts/keiba_endogenous_threshold_null_bridge.py'
      - 'tests/test_keiba_endogenous_threshold_null_bridge.py'
      - 'docs/betting/endogenous-threshold-no-information-null-20261025.md'
      - '.github/workflows/keiba-endogenous-threshold-null.yml'
  pull_request:
    paths:
      - 'scripts/keiba_endogenous_threshold_null_bridge.py'
      - 'tests/test_keiba_endogenous_threshold_null_bridge.py'
      - 'docs/betting/endogenous-threshold-no-information-null-20261025.md'
      - '.github/workflows/keiba-endogenous-threshold-null.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  falsify-prespecified-market-threshold:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Verify exact legacy rules, pure no-information null, source clocks and future outcome firewall
        run: |
          python -m compileall -q scripts/keiba_endogenous_threshold_null_bridge.py tests/test_keiba_endogenous_threshold_null_bridge.py
          python -m unittest discover -s tests -p 'test_keiba_endogenous_threshold_null_bridge.py' -v
      - name: Generate source-locked six-race counterfactuals before JRA outcomes
        run: |
          python scripts/keiba_endogenous_threshold_null_bridge.py --preoutcome-only --draws 100 --null-seeds 30 --output tmp/endogenous-null-preoutcome.json
          python -c "import json; r=json.load(open('tmp/endogenous-null-preoutcome.json')); assert r['source_races']==6 and r['source_meeting_dates']==2 and r['horse_race_entries']==84 and r['official_score']=='NOT_COMPUTED' and r['official_or_criticality_evidence']=='HOLD'"
      - name: Retrospective scores without refitting physical or social coefficient
        run: |
          python scripts/keiba_endogenous_threshold_null_bridge.py --draws 150 --null-seeds 30 --output tmp/endogenous-null-retrospective.json
          python -c "import json; r=json.load(open('tmp/endogenous-null-retrospective.json')); assert r['source_races']==6 and r['source_meeting_dates']==2 and r['horse_race_entries']==84 and r['official_outcomes_read_only_after_all_horse_market_and_null_models'] and r['same_six_real_races_not_new_independent_observations']"
      - name: Show only aggregate false-threshold rates and fixed social policies
        run: |
          python -c "import json; r=json.load(open('tmp/endogenous-null-retrospective.json')); print('NULL_FALSE_THRESHOLDS_BY_DATE',json.dumps(r['by_source_meeting_date_null'],sort_keys=True)); print('HARD_SMOOTH_FIXED_COMPARE',json.dumps({a:{c:{str(t):r['historical_scores'][a][c][str(t)] for t in [1,3,5]} for c in ['0.0','2.0']} for a in ['initial_market','historical_form']},sort_keys=True)); print('DATE_EQUAL_SCORE_COMPARISON',json.dumps(r['date_equal_scores'],sort_keys=True)); print('EMPIRICAL_THRESHOLD_DECISION',r['official_or_criticality_evidence'])"
      - uses: actions/upload-artifact@v4
        with:
          name: endogenous-threshold-null-source-scoped-aggregates
          path: |
            tmp/endogenous-null-preoutcome.json
            tmp/endogenous-null-retrospective.json
          retention-days: 14
