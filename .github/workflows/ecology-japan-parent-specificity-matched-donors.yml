name: "Horse recorded-parent specificity against matched donors"
on:
  push:
    branches: [analysis/horse-parent-specificity-matched-donors-20261127]
    paths:
      - "scripts/ecology_japan_parent_specificity_matched_donors.py"
      - "docs/research/JAPAN_PARENT_SPECIFICITY_MATCHED_DONORS_PROTOCOL_20261127.md"
      - ".github/workflows/ecology-japan-parent-specificity-matched-donors.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  occupancy-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Synthetic donor exclusion and matched support
        run: python scripts/ecology_japan_parent_specificity_matched_donors.py --self-test
      - name: Download fixed source A
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Reproduce PR111 and compare matched alternate donors
        run: python scripts/ecology_japan_parent_specificity_matched_donors.py --archive tmp/private/old.zip --receipt docs/evidence/japan-family-depth-unconstrained-20261127.json --output tmp/parent-specificity-matched-donors.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: parent-specificity-matched-donors-aggregate-only
          path: tmp/parent-specificity-matched-donors.json
          if-no-files-found: error
          retention-days: 14
