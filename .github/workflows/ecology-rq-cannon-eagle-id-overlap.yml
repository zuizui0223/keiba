name: "Ecology: original horse-ID overlap across Cannon and Eagle tracks"

# Source-readiness only; not a racehorse treatment/evolution test.
# Two pre-existing locked 2026 cohorts: Cannon 12 dates/R1-8,
# Eagle Farm 12 dates/R1-6. Never emit raw HORSES IDs/runner rows.
on:
  push:
    branches:
      - research/ecological-reaction-norms
    paths:
      - 'scripts/ecology_rq_cannon_eagle_id_overlap.py'
      - 'tests/test_ecology_rq_cannon_eagle_id_overlap.py'
      - 'scripts/ecology_rq_thoroughbred_sectional_audit.py'
      - '.github/workflows/ecology-rq-cannon-eagle-id-overlap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-two-venue-HORSES-id-comparability:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-source model requirements
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Fictitious names and original ID no-confounding contract
        run: python -m unittest discover -s tests -p 'test_ecology_rq_cannon_eagle_id_overlap.py' -v
      - name: Read only two locked original first-party source cohorts
        run: |
          python scripts/ecology_rq_cannon_eagle_id_overlap.py --output tmp/rq-Cannon-Eagle-24-locked-date-ID-overlap-aggregate.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('tmp/rq-Cannon-Eagle-24-locked-date-ID-overlap-aggregate.json').read_text())
          assert x['status']=='ORIGINAL_HORSES_ID_CROSS_SITE_OBSERVATION_COMPARABILITY_NOT_H1_H2'
          assert x['no_original_individual_identity_or_GPS_outcome_exported']
          assert not x['H1_ground_response_supported'] and not x['H2_competitor_effect_supported']
          assert len(x['data_lock']['Cannon_source_dates_HOLD'])<=4
          assert len(x['data_lock']['Eagle_source_dates_HOLD'])<=4
          o=x['same_HORSES_ID_animal_source_overlap']
          assert o['no_names_numeric_HORSES_IDs_or_original_GPS_rows_exported']
          assert o['source_positive_GPS_rows_by_venue']['Cannon Park']>=250
          assert o['source_positive_GPS_rows_by_venue']['Eagle Farm']>=200
          print("CROSS_VENUE_FEASIBILITY_DECISION",o['scientific_decision'])
          print("CROSS_VENUE_SAFE_ID_COUNT",o['distinct_same_name_safe_original_HORSES_IDs_observed_at_both_venues'])
          print("MATCHED_FIRST_MARKER_DIST_CLASS",o['BOTH_venues_with_1plus_identical_marker_distance_AND_official_class'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-rq-two-venue-HORSES-ID-overlap-aggregate-only
          path: tmp/rq-Cannon-Eagle-24-locked-date-ID-overlap-aggregate.json
          retention-days: 30
