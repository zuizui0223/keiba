name: Japan EVA EquCab2 assembly identity map
on:
  push:
    branches: [analysis/japan-genomic-relatedness-20261114]
    paths: [.github/workflows/japan-eva-assembly-map.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download only official NCBI assembly report
        run: |
          mkdir -p evidence
          python - <<'PY'
          import urllib.request,hashlib,json
          from pathlib import Path
          url='https://ftp.ncbi.nlm.nih.gov/genomes/all/GCA/000/002/305/GCA_000002305.1_EquCab2.0/GCA_000002305.1_EquCab2.0_assembly_report.txt'
          req=urllib.request.Request(url,headers={'User-Agent':'keiba-public-genotype-audit/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r: body=r.read(1000000)
          text=body.decode('utf-8')
          assert '# Assembly name:' in text and 'EquCab2.0' in text
          Path('evidence/EquCab2.0_assembly_report.txt').write_bytes(body)
          result={'url':url,'sha256':hashlib.sha256(body).hexdigest(),'bytes':len(body)}
          Path('evidence/assembly_source.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result));print(text[:8000])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: japan-eva-EquCab2-assembly-map
          path: evidence/
          retention-days: 3
