name: "Sire context specificity: split-half biological information diagnostic"
on:
  push:
    branches: [analysis/kin-context-specificity-20261124]
    paths:
      - "scripts/ecology_japan_sire_context_specificity.py"
      - "docs/research/JAPAN_SIRE_CONTEXT_SPECIFICITY_PROTOCOL.md"
      - ".github/workflows/ecology-japan-sire-context-specificity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context-specificity:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - name: Synthetic disjointness and contrast verification
        run: python scripts/ecology_japan_sire_context_specificity.py --self-test
      - name: Download source A to private runner
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Run held-year baseline and context-contrast diagnostic
        run: python scripts/ecology_japan_sire_context_specificity.py --archive tmp/private/old.zip --output tmp/sire-context-specificity-aggregate.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: sire-context-specificity-aggregate-only
          path: tmp/sire-context-specificity-aggregate.json
          if-no-files-found: error
          retention-days: 14
