name: Jv Odds Visualizer CSV to rights-reviewed private WIN WIDE capture contract

on:
  push:
    branches: [analysis/jv-visualizer-csv-source-adapter-20261028]
    paths:
      - 'scripts/keiba_jv_visualizer_export_adapter.py'
      - 'tests/test_keiba_jv_visualizer_export_adapter.py'
      - 'docs/betting/jv-visualizer-csv-source-adapter-20261028.md'
      - '.github/workflows/keiba-jv-visualizer-csv-bridge.yml'
  pull_request:
    paths:
      - 'scripts/keiba_jv_visualizer_export_adapter.py'
      - 'tests/test_keiba_jv_visualizer_export_adapter.py'
      - 'docs/betting/jv-visualizer-csv-source-adapter-20261028.md'
      - '.github/workflows/keiba-jv-visualizer-csv-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  only-synthetic-vendor-csv-no-fake-JRA-source:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Strict 17-column meta + empty + tab + one-time table CSV importer
        run: |
          python -m compileall -q scripts/keiba_jv_visualizer_export_adapter.py tests/test_keiba_jv_visualizer_export_adapter.py
          python -m unittest discover -s tests -p 'test_keiba_jv_visualizer_export_adapter.py' -v
      - name: Full-WIDE primary stays complete and WIN-only supplement remains separate
        run: |
          python -m unittest discover -s tests -p 'test_keiba_win_only_shadow_lane.py' -v
          python -m unittest discover -s tests -p 'test_keiba_operator_winwide_capture.py' -v
          python -m unittest discover -s tests -p 'test_keiba_dual_market_lane_audit.py' -v
      - name: Type-specific SHA verification and old v3.1 source contracts must not mutate
        run: |
          python -m unittest discover -s tests -p 'test_keiba_win_only_github_receipt.py' -v
          python -m unittest discover -s tests -p 'test_keiba_operator_cohort_bundle.py' -v
      - name: Never claim a real CSV or live JRA race receipt
        run: |
          python -c "import sys; sys.path.insert(0,'scripts'); import keiba_jv_visualizer_export_adapter as a; assert a.STATUS.endswith('NOT_REMOTE_CAPTURE_PROOF'); print('REAL_JRA_VAN_CSV_IMPORTED_BY_THIS_CI',0); print('INDEPENDENT_FUTURE_MARKET_SHA_RECEIPTS',0); print('REAL_JRA_HORSE_POSITION_AND_BETTOR_VOTES_INFERRED',False)"
