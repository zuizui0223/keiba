name: Shuka Sho odds information hierarchy audit

on:
  push:
    branches:
      - analysis/odds-information-hierarchy-20261023
    paths:
      - scripts/shuka2026_odds_information_hierarchy.py
      - scripts/odds_market_accounting_null.py
      - scripts/odds_cross_pool_global_async.py
      - tests/test_odds_cross_pool_global_async.py
      - tests/test_odds_market_accounting_null.py
      - scripts/odds_threshold_forward_eval.py
      - tests/test_odds_threshold_forward_eval.py
      - tests/test_shuka2026_odds_information_hierarchy.py
      - docs/odds-information-hierarchy-20261023.md
      - .github/workflows/odds-information-hierarchy.yml
  pull_request:
    paths:
      - scripts/shuka2026_odds_information_hierarchy.py
      - scripts/odds_market_accounting_null.py
      - scripts/odds_cross_pool_global_async.py
      - tests/test_odds_cross_pool_global_async.py
      - tests/test_odds_market_accounting_null.py
      - tests/test_shuka2026_odds_information_hierarchy.py
      - docs/odds-information-hierarchy-20261023.md
      - .github/workflows/odds-information-hierarchy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-descriptive-and-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run locked source, clocks, synthetic feedback and no postrace leakage tests
        run: |
          python -m unittest discover -s tests -p 'test_shuka2026_odds_information_hierarchy.py' -v
          python -m unittest discover -s tests -p 'test_odds_threshold_forward_eval.py' -v
          python -m unittest discover -s tests -p 'test_odds_market_accounting_null.py' -v
          python -m unittest discover -s tests -p 'test_odds_cross_pool_global_async.py' -v
      - name: 300 synthetic bettor paths per mechanism; real odds analysis is descriptive only
        run: python scripts/shuka2026_odds_information_hierarchy.py --paths 300 --seed 20261023 --output tmp/shuka-odds-hierarchy.json
      - name: Validate expected archival pattern and explicit nonidentifiability
        run: |
          python -c "import json; d=json.load(open('tmp/shuka-odds-hierarchy.json')); assert d['snapshot_count']==4; assert len(d['wide_market_windows'])==3; assert d['transitions'][1]['different_20pct_or_more_quote_horses']==6; assert 7.57<d['transitions'][1]['relative_share_total_variation_pp']<7.59; assert d['cross_pool_non_synchrony']['relative_wide_pair_ranking_reversal']; assert d['inference_gates']['forecast_skill_threshold'].startswith('HOLD'); assert not d['inference_gates']['backtest_outcomes_used_in_model_fitting']"
      - name: Synthetic future-only winner and Top3 threshold scoring with chronological date blocks
        run: |
          python scripts/odds_threshold_forward_eval.py --demo-synthetic --output tmp/odds-threshold-future-demo.json
          python -c "import json; x=json.load(open('tmp/odds-threshold-future-demo.json')); assert x['status'].startswith('SYNTHETIC'); assert x['train_max_date']<x['future_min_date']; assert x['training_race_count']>=35 and x['future_race_count']>=12; assert x['training_only_selected_parameters']['train_selected_threshold_path']['early_odds_at_least'] in [5,10,20,50]"
      - name: Mathematical accounting identity and independent-no-herding Monte Carlo
        run: |
          python scripts/odds_market_accounting_null.py --paths 300 --seed 20261023 --output tmp/odds-accounting-negative-control.json
          python -c "import json; r=json.load(open('tmp/odds-accounting-negative-control.json')); z=r['observed_intervals_conditional_on_proxy']; assert len(z)==3; assert abs(z[1]['minimum_new_fraction_of_final_pool_conditional_on_exact_share_proxy']-.17202998646422618)<1e-7; assert z[1]['source_change'] and r['inference_decision']['actual_new_pool_fraction'].startswith('HOLD'); assert r['mechanical_memory_counterexample']['results']['independent_uniform_new_votes']['mean_across_horse_prior_vs_final_share_Pearson']>.99"
      - name: All 136 cross-pool wide-pair residual indices and asynchronous gaps
        run: |
          python scripts/odds_cross_pool_global_async.py --output tmp/odds-cross-pool-index.json
          python -c "import json; r=json.load(open('tmp/odds-cross-pool-index.json')); a,b=r['cross_pool_pair_contrasts']; assert a['pair_count']==136 and b['pair_count']==136; assert a['pairs_with_cross_pool_residual_ratio_change_at_least_25pct']==27 and b['pairs_with_cross_pool_residual_ratio_change_at_least_25pct']==0; assert not r['underlying_per_pool_quote_update_times_verified']"
      - uses: actions/upload-artifact@v4
        with:
          name: odds-hierarchy-descriptive-and-synthetic-only
          path: |
            tmp/shuka-odds-hierarchy.json
            tmp/odds-threshold-future-demo.json
            tmp/odds-accounting-negative-control.json
            tmp/odds-cross-pool-index.json
          retention-days: 14
