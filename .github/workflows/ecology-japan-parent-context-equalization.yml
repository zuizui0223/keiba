name: "Equal-count parent context information channels"
on:
  push:
    branches: [analysis/kin-context-parent-equalization-20261124]
    paths:
      - "scripts/ecology_japan_parent_context_equalization.py"
      - "docs/research/JAPAN_PARENT_CONTEXT_EQUALIZATION_PROTOCOL.md"
      - ".github/workflows/ecology-japan-parent-context-equalization.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parent-context:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - name: Synthetic equal-count and sampling checks
        run: python scripts/ecology_japan_parent_context_equalization.py --self-test
      - name: Download fixed source A
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Reproduce PR82 then fit equal-count paternal and maternal channels
        run: python scripts/ecology_japan_parent_context_equalization.py --archive tmp/private/old.zip --output tmp/parent-context-equalization.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: parent-context-equalization-aggregate-only
          path: tmp/parent-context-equalization.json
          if-no-files-found: error
          retention-days: 14
