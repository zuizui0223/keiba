name: "Horse parent information on daily common ability scale"
on:
  push:
    branches: [analysis/horse-family-ability-complement-20261126]
    paths:
      - "scripts/ecology_japan_family_ability_complement.py"
      - "docs/research/JAPAN_FAMILY_ABILITY_COMPLEMENT_PROTOCOL_20261126.md"
      - ".github/workflows/ecology-japan-family-ability-complement.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  occupancy-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Synthetic prior parent support and self exclusion
        run: python scripts/ecology_japan_family_ability_complement.py --self-test
      - name: Download fixed source A
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Run daily rating parity and parent information complement
        run: python scripts/ecology_japan_family_ability_complement.py --archive tmp/private/old.zip --receipt docs/evidence/japan-daily-ability-20261126.json --output tmp/family-ability-complement.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: family-ability-complement-aggregate-only
          path: tmp/family-ability-complement.json
          if-no-files-found: error
          retention-days: 14
