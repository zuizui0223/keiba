name: "Tenno quoted odds: quantization-robust nonmonotone prices versus unidentifiable social mechanisms"

on:
  push:
    branches: [analysis/tenno-quantized-nonmonotone-identifiability-20261031]
    paths:
      - 'scripts/keiba_tenno_quantized_nonmonotone_identification.py'
      - 'tests/test_keiba_tenno_quantized_nonmonotone_identification.py'
      - 'docs/betting/tenno-quantized-nonmonotone-identifiability-20261031.md'
      - '.github/workflows/keiba-tenno-quantized-nonmonotone-identification.yml'
  pull_request:
    paths:
      - 'scripts/keiba_tenno_quantized_nonmonotone_identification.py'
      - 'tests/test_keiba_tenno_quantized_nonmonotone_identification.py'
      - 'docs/betting/tenno-quantized-nonmonotone-identifiability-20261031.md'
      - '.github/workflows/keiba-tenno-quantized-nonmonotone-identification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reported-partial-odds-mechanism-audit-no-podium:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Test source-locked partial WIN pairs, alternative quantization, and observational equivalence
        run: |
          python -m compileall -q scripts/keiba_tenno_quantized_nonmonotone_identification.py tests/test_keiba_tenno_quantized_nonmonotone_identification.py
          python -m unittest discover -s tests -p 'test_keiba_tenno_quantized_nonmonotone_identification.py' -v
          python -m unittest discover -s tests -p 'test_keiba_tenno_partial_article_timepath.py' -v
      - name: Compute quantization-sensitivity output with no JRA outcome, original new WIN q2, or bettor votes
        run: |
          python scripts/keiba_tenno_quantized_nonmonotone_identification.py --output tmp/tenno-quantized-nonmonotone-mechanism-hold.json
          python -c "import json; r=json.load(open('tmp/tenno-quantized-nonmonotone-mechanism-hold.json')); q=r['quantization_sensitivity']; assert [q[k]['count_pairs_necessarily_nonmonotone'] for k in ('nearest_tenth_hypothetical','truncate_tenth_hypothetical','union_of_both_conservative')]==[8,8,6]; assert r['three_observationally_equivalent_mechanism_constructions']['all_three_structures_fit_at_observation_points_not_model_comparison']; assert r['new_remote_SHA_verified_prospective_trials']==0 and not r['original_race_outcome_or_wager_payout_used']; print('ZERO_CAUSAL_THRESHOLD_OR_REAL_NEW_MARKET_SUCCESS',True)"
      - uses: actions/upload-artifact@v4
        with:
          name: tenno-quantization-nonmonotone-10-pairs-and-identification-hold
          path: tmp/tenno-quantized-nonmonotone-mechanism-hold.json
          retention-days: 20
