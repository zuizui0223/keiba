name: "Japan 2022-24 moderator aggregate evidence and negative-result preservation"

on:
  push:
    branches: [analysis/2022-2024-kin-information-moderators-20261118]
    paths:
      - ".github/workflows/ecology-japan-2022-24-moderator-evidence.yml"
      - "tests/test_ecology_japan_2022_2024_kin_moderator_evidence.py"
      - "docs/evidence/japan-2022-24-posthoc-kin-information-moderators-20261118.json"
  pull_request:
    paths:
      - ".github/workflows/ecology-japan-2022-24-moderator-evidence.yml"
      - "tests/test_ecology_japan_2022_2024_kin_moderator_evidence.py"
      - "docs/evidence/japan-2022-24-posthoc-kin-information-moderators-20261118.json"

permissions:
  contents: read

jobs:
  posthoc-aggregate-source-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile original strict source and actual moderator aggregate signs
        run: |
          python -m unittest discover -s tests \
            -p "test_ecology_japan_2022_2024_kin_moderator_evidence.py" -v
