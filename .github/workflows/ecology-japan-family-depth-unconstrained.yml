name: "Horse unattenuated family ability and depth contrast"
on:
  push:
    branches: [analysis/horse-family-depth-unconstrained-20261127]
    paths:
      - "scripts/ecology_japan_family_depth_unconstrained.py"
      - "docs/research/JAPAN_FAMILY_DEPTH_UNCONSTRAINED_PROTOCOL_20261127.md"
      - ".github/workflows/ecology-japan-family-depth-unconstrained.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  occupancy-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Synthetic attenuation and common-date contrast
        run: python scripts/ecology_japan_family_depth_unconstrained.py --self-test
      - name: Download fixed source A
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Run exact PR107/110 replay and unattenuated family comparison
        run: python scripts/ecology_japan_family_depth_unconstrained.py --archive tmp/private/old.zip --receipt docs/evidence/japan-daily-ability-20261126.json --family-receipt docs/evidence/japan-family-ability-complement-20261126.json --output tmp/family-depth-unconstrained.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: family-depth-unconstrained-aggregate-only
          path: tmp/family-depth-unconstrained.json
          if-no-files-found: error
          retention-days: 14
