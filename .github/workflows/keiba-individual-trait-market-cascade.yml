name: Individual repeatability to horse ABM/PDE and market mechanism
on:
  push:
    branches: [analysis/horse-trait-market-feedback-stability-20261026]
    paths:
      - 'scripts/keiba_individual_trait_to_market_cascade.py'
      - 'scripts/keiba_trait_uncertainty_ensemble.py'
      - 'scripts/keiba_trait_uncertainty_demo.py'
      - 'scripts/keiba_individual_trait_market_demo.py'
      - 'tests/test_keiba_individual_trait_to_market_cascade.py'
      - 'tests/test_keiba_trait_uncertainty_ensemble.py'
      - 'docs/betting/individual-repeatability-market-cascade-20261026.md'
      - '.github/workflows/keiba-individual-trait-market-cascade.yml'
  pull_request:
    paths:
      - 'scripts/keiba_individual_trait_to_market_cascade.py'
      - 'scripts/keiba_trait_uncertainty_ensemble.py'
      - 'scripts/keiba_trait_uncertainty_demo.py'
      - 'scripts/keiba_individual_trait_market_demo.py'
      - 'tests/test_keiba_individual_trait_to_market_cascade.py'
      - 'tests/test_keiba_trait_uncertainty_ensemble.py'
      - 'docs/betting/individual-repeatability-market-cascade-20261026.md'
      - '.github/workflows/keiba-individual-trait-market-cascade.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-same-horse-physics-bettors:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific dependency for inherited horse particle and PDE laws
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Check all source gates, integrated probability and null markets
        run: |
          python -m compileall -q scripts/keiba_individual_trait_to_market_cascade.py tests/test_keiba_individual_trait_to_market_cascade.py
          python -m unittest discover -s tests -p test_keiba_individual_trait_to_market_cascade.py -v
          python -m unittest discover -s tests -p test_keiba_trait_uncertainty_ensemble.py -v
      - name: Toy posterior uncertainty and evolving social imitation law
        run: |
          python scripts/keiba_trait_uncertainty_demo.py --draws 20 --horse-draws 80 --seed 20261026 --output tmp/synthetic-trait-uncertainty-cascade.json
          python -c "import json; x=json.load(open('tmp/synthetic-trait-uncertainty-cascade.json')); assert x['status']=='ARTIFICIAL_HORSE_TRAIT_AND_BETTOR_POPULATION_COHORT_ONLY'; assert x['social_info_release']['no_information_final_markets_equal']; assert x['price_threshold_discovery'] is None"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-horse-uncertainty-to-social-market-demo-no-real-data
          path: tmp/synthetic-trait-uncertainty-cascade.json
          retention-days: 14
      - name: Independent synthetic six-horse case and analytic amplification check
        run: |
          python scripts/keiba_individual_trait_market_demo.py --horse-draws 250 --output tmp/synthetic-individual-to-market.json
          python -c "import json; x=json.load(open('tmp/synthetic-individual-to-market.json')); assert x['status']=='TOY_SYNTHETIC_ONLY_NOT_JRA_EVIDENCE'; assert x['no_information_reached_market_exactly_identical']; assert x['stability_at_uniform_fixed_point_for_50pct_social_20pct_new_votes']['2.0']['regime']=='neutral'"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-individual-to-market-diagnostics-not-real-evidence
          path: tmp/synthetic-individual-to-market.json
          retention-days: 14
