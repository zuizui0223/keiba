name: "Shuka Sho 2026: official JRA 17-runner frozen v3.1 non-market audit"

# Separate development-only shadow, NOT formal 20-race prospective
# v3.1 holdout. The market M, final horse numbers, trained
# probabilities and expected value are NOT fabricated.
on:
  push:
    branches:
      - analysis/shuka-20261018-official-form
    paths:
      - 'data/2026-10-18/shuka-jra-official-17-pre-draw.json'
      - 'scripts/shuka2026_official_rule_audit.py'
      - 'tests/test_shuka2026_official_rule_audit.py'
      - 'data/2026-10-18/shuka-jra-official-17-horse-numbers.json'
      - 'scripts/shuka2026_bind_draw_numbers.py'
      - 'tests/test_shuka2026_bind_draw_numbers.py'
      - 'scripts/shuka2026_market_overlay.py'
      - 'tests/test_shuka2026_market_overlay.py'
      - 'data/2026-10-18/shuka-jra-2026-context-last4c-history.json'
      - 'scripts/shuka2026_JRA_historical_context.py'
      - 'tests/test_shuka2026_JRA_historical_context.py'
      - '.github/workflows/shuka2026-v31-shadow.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jra-prerace-historical-channels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test actual frozen v3.1 rules on official 17 horse histories
        run: |
          python -m unittest discover -s tests -p 'test_shuka2026_official_rule_audit.py' -v
      - name: Validate official post-draw numbers independently of model odds
        run: python -m unittest discover -s tests -p 'test_shuka2026_bind_draw_numbers.py' -v
      - name: Falsify fake, stale, before-sale or incomplete market inputs
        run: python -m unittest discover -s tests -p 'test_shuka2026_market_overlay.py' -v
      - name: Evaluate no-odds exact market coverage and tie conditions
        run: |
          python scripts/shuka2026_market_overlay.py \
            --output reports/2026-10-16/shuka2026-market-M-HOLD-and-coverage-bounds.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("reports/2026-10-16/shuka2026-market-M-HOLD-and-coverage-bounds.json").read_text())
          assert q["status"]=="HOLD_UNTIL_ACTUAL_JRA_WIN_ODDS_ARE_AVAILABLE"
          assert q["historical_C1_U_Q1_AND_K1_candidates"]==[1,3,6,8,9,12]
          assert q["market_M_numbers"] is None and q["full_union_candidate_numbers"] is None
          s=q["locked_market_coverage_scenario"]
          assert s["frozen_M_nominal_top_quarter_count_without_ties"]==5
          assert (s["nominal_M_no_ties_final_union_min"],s["nominal_M_no_ties_final_union_max"])==(6,11)
          assert s["maximum_candidate_count_below_or_equal_65pct"]==11
          print("MARKET_WAIT_STATUS",q["status"])
          print("MARKET_M_MINIMAL_DET_BOUND",s["nominal_M_no_ties_final_union_min"],s["nominal_M_no_ties_final_union_max"])
          print("PRERACE_ODDS_DATA_NOT_FABRICATED",True)
          PY
      - name: Verify original JRA 2026 ten-year historical context is not a new model feature
        run: python -m unittest discover -s tests -p 'test_shuka2026_JRA_historical_context.py' -v
      - name: Render original JRA past 10-year prep/corner context as a separate caution
        run: |
          python scripts/shuka2026_JRA_historical_context.py \
            --output reports/2026-10-16/shuka2026-JRA-2026-retrospective-risk-not-model.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("reports/2026-10-16/shuka2026-JRA-2026-retrospective-risk-not-model.json").read_text())
          assert q["official_seventeen_horse_count"]==17
          assert q["original_frozen_v31_model_code_or_thresholds_NOT_modified"]
          assert q["not_added_to_model_rank_win_probabilities_or_M_market"]
          assert q["past_10_years_winner_counts_not_target_probabilities"]=={
              "oaks_direct":7,"shion_stakes":3,"rose_stakes":0
          }
          print("JRA_ORIGINAL_HISTORICAL_RISK_LABELS",
            [[x["JRA_official_horse_number"],x["descriptive_context_label_NOT_a_win_probability"]]
              for x in q["horse_history_context_rows"]
              if x["JRA_official_horse_number"] in (3,8,13,14)])
          PY
      - name: Produce source-attributed no-odds no-draw classification
        run: |
          python scripts/shuka2026_official_rule_audit.py \
            --output reports/2026-10-16/shuka2026-pre-draw-v31-without-M.json
          python - <<'PY'
          import json
          from pathlib import Path
          f=Path("reports/2026-10-16/shuka2026-pre-draw-v31-without-M.json")
          q=json.loads(f.read_text())
          assert q["horse_count"]==17
          assert not q["original_v31_thresholds_changed"]
          assert not q["real_confirmed_horse_numbers_captured"]
          assert not q["real_timestamped_pre_race_win_odds_captured"]
          assert not q["market_M_channel_completed"]
          assert not q["formal_v31_pre_result_15_to_25_minutes_freeze"]
          assert len(q["nonmarket_C1_or_U_or_rescue_names"])==6
          print("JRA_V31_SOURCE_STATUS",q["status"])
          print("JRA_V31_HISTORICAL_CHANNEL_COUNTS",q["counts_by_channel"])
          print("JRA_V31_NONMARKET_CANDIDATE_NAMES",q["nonmarket_C1_or_U_or_rescue_names"])
          print("CURRENT_JRA_ODDS_AND_HORSE_NUMBERS_STATUS","NOT_CLAIMED")
          PY
      - name: Rebind JRA real horse numbers to exact same six candidates
        run: |
          python scripts/shuka2026_bind_draw_numbers.py \
            --output reports/2026-10-16/shuka2026-JRA-draw-v31-without-M.json
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("reports/2026-10-16/shuka2026-JRA-draw-v31-without-M.json").read_text())
          assert q["official_17_horse_numbers_confirmed"]
          assert q["official_nonmarket_v31_candidate_numbers_NOT_RANKING"]==[1,3,6,8,9,12]
          assert q["actual_live_market_M_still_HOLD"]
          assert q["market_plus_historical_v31_complete_union"] is None
          print("JRA_OFFICIAL_SHUKA_V31_NONMARKET_NUMBERS",q["official_nonmarket_v31_candidate_numbers_NOT_RANKING"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: shuka2026-JRA-retrospective-form-position-outside-v31
          path: reports/2026-10-16/shuka2026-JRA-2026-retrospective-risk-not-model.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: shuka2026-JRA-GI-sale-window-and-market-coverage-HOLD
          path: reports/2026-10-16/shuka2026-market-M-HOLD-and-coverage-bounds.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: shuka2026-JRA-draw-confirmed-v31-market-not-known
          path: reports/2026-10-16/shuka2026-JRA-draw-v31-without-M.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: shuka2026-official-JRA-v31-historical-only-shadow
          path: reports/2026-10-16/shuka2026-pre-draw-v31-without-M.json
          retention-days: 30
