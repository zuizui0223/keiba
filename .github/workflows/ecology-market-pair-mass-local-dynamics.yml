name: "Synthetic pair mass and local dynamics"
on:
  push:
    branches: [analysis/market-pair-mass-local-dynamics-20261127]
    paths:
      - "scripts/ecology_market_pair_mass_local_dynamics.mjs"
      - "docs/research/MARKET_PAIR_MASS_LOCAL_DYNAMICS_PROTOCOL_20261127.md"
      - ".github/workflows/ecology-market-pair-mass-local-dynamics.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/ecology_market_pair_mass_local_dynamics.mjs tmp/market-pair-mass-local-dynamics.json docs/evidence/market-perturbation-field-stability-20261127.json docs/evidence/market-pair-mass-local-dynamics-20261127.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-pair-mass-local-dynamics-aggregate
          path: tmp/market-pair-mass-local-dynamics.json
          if-no-files-found: error
          retention-days: 14
