name: "Synthetic stock-state counterfactual"
on:
  push:
    branches: [analysis/market-stock-state-counterfactual-20261127]
    paths:
      - "scripts/ecology_market_stock_state_counterfactual.mjs"
      - "docs/research/MARKET_STOCK_STATE_COUNTERFACTUAL_PROTOCOL_20261127.md"
      - ".github/workflows/ecology-market-stock-state-counterfactual.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/ecology_market_stock_state_counterfactual.mjs tmp/market-stock-state-counterfactual.json docs/evidence/market-public-evidence-nonlinear-summary-20261127.json docs/evidence/market-stock-state-counterfactual-summary-20261127.json
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-stock-state-aggregate
          path: tmp/market-stock-state-counterfactual.json
          if-no-files-found: error
          retention-days: 14
