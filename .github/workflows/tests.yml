name: tests

on:
  pull_request:
  push:
    branches:
      - main
      - analysis/kyoto-20261012

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run unittest suite
        env:
          PYTHONUTF8: '1'
        run: python scripts/run_non_ecology_tests.py
