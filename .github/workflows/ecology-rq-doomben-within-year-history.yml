name: "Ecology Doomben locked within-year own-vs-other horse histories"

# Existing prelocked 23 Doomben 2025 dates and 19 2026 dates.
# The previous positive Cannon Park result and negative 2025->2026
# Doomben evaluation were KNOWN BEFORE this follow-up protocol.
# No extra dates, markers, racers or new source files are selected.
# Output contains only safe aggregates/hashes/HOLD labels.
on:
  push:
    branches:
      - research/ecological-reaction-norms
    paths:
      - 'docs/ecology-rq-doomben-within-year-history-design-lock.md'
      - 'scripts/ecology_rq_doomben_within_year_history.py'
      - 'tests/test_ecology_rq_doomben_within_year_history.py'
      - '.github/workflows/ecology-rq-doomben-within-year-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-original-2025-and-2026-within-year:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original-source model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Fictional source ID/date leakage, cross-year hold and class-reset tests
        run: python -m unittest discover -s tests -p 'test_ecology_rq_doomben_within_year_history.py' -v
      - name: Reuse ONLY 42 previously locked Doomben original source meeting dates
        run: |
          python scripts/ecology_rq_doomben_within_year_history.py \
            --output tmp/doomben-within-2025-and-2026-aggregate-only.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('tmp/doomben-within-2025-and-2026-aggregate-only.json').read_text())
          assert d['status']=='EXPLORATORY_ORIGINAL_DOOMBEN_SAME_YEAR_CONTEXT_CONTROL_NOT_CAUSAL'
          assert d['original_source_calendar']['fixed_2025_date_count']==23
          assert d['original_source_calendar']['fixed_2026_date_count']==19
          assert len(d['comparisons_by_year_marker_context'])==8
          assert d['not_a_within_individual_year_change_or_H1_H2']
          assert d['no_individual_horse_names_IDs_role_IDs_section_times_or_predictions_exported']
          for key,model in d['comparisons_by_year_marker_context'].items():
              assert model['no_original_horse_ID_names_role_IDs_or_individual_predictions']
              assert model['no_2025_or_2026_crossyear_combination_for_training']
              assert model['comparison_population']['same_date_not_used_to_fit_prior_profiles']
              if model['status'].startswith('HOLD_'):
                  assert 'equal_horse_RMSE_seconds' not in model
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doomben-2025-2026-separate-within-year-history-safe-aggregate
          path: tmp/doomben-within-2025-and-2026-aggregate-only.json
          retention-days: 30
