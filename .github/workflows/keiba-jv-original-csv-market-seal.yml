name: KEIBA original Jv Visualizer CSV bytes committed into market model SHA

on:
  push:
    branches: [analysis/jv-raw-csv-to-frozen-market-sha-20261028]
    paths:
      - 'scripts/keiba_operator_winwide_capture.py'
      - 'scripts/keiba_jv_visualizer_export_adapter.py'
      - 'tests/test_keiba_jv_visualizer_export_adapter.py'
      - 'docs/betting/jv-visualizer-csv-source-adapter-20261028.md'
      - '.github/workflows/keiba-jv-original-csv-market-seal.yml'
  pull_request:
    paths:
      - 'scripts/keiba_operator_winwide_capture.py'
      - 'scripts/keiba_jv_visualizer_export_adapter.py'
      - 'tests/test_keiba_jv_visualizer_export_adapter.py'
      - 'docs/betting/jv-visualizer-csv-source-adapter-20261028.md'
      - '.github/workflows/keiba-jv-original-csv-market-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-CSV-versus-captured-horse-market-values:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Source import, byte-level checksum, complete reparse and both frozen market lane SHAs
        run: |
          python -m compileall -q scripts/keiba_operator_winwide_capture.py scripts/keiba_jv_visualizer_export_adapter.py tests/test_keiba_jv_visualizer_export_adapter.py
          python -m unittest discover -s tests -p 'test_keiba_jv_visualizer_export_adapter.py' -v
      - name: Existing lawful private source capture, forward WIN-WIDE and WIN-only experiments preserved
        run: |
          python -m unittest discover -s tests -p 'test_keiba_operator_winwide_capture.py' -v
          python -m unittest discover -s tests -p 'test_keiba_operator_cohort_bundle.py' -v
          python -m unittest discover -s tests -p 'test_keiba_win_only_shadow_lane.py' -v
          python -m unittest discover -s tests -p 'test_keiba_dual_market_lane_audit.py' -v
      - name: Real Github comment cannot be produced by fabricated CSV test
        run: |
          python -m unittest discover -s tests -p 'test_keiba_win_only_github_receipt.py' -v
          python -m unittest discover -s tests -p 'test_keiba_nextprice_pr_comment_attestation.py' -v
          python -c "import sys; sys.path.insert(0,'scripts'); import keiba_operator_winwide_capture as c; assert c.CAPTURE_VENDOR_SCHEMA.endswith('_V1'); print('RAW_VENDOR_BYTES_REQUIRED_AT_APPEND_FOR_VENDOR_SOURCE',True); print('REAL_LICENSED_JRA_CSV_SOURCE_ACQUIRED_BY_CI',False); print('REAL_NEW_FORECAST_SHA_EXTERNALLY_POSTED',False)"
