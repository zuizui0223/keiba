name: "Management-matched family context information"
on:
  push:
    branches: [analysis/kin-context-management-matched-20261124]
    paths:
      - "scripts/ecology_japan_context_management_matched.py"
      - "docs/research/JAPAN_CONTEXT_MANAGEMENT_MATCHED_PROTOCOL.md"
      - ".github/workflows/ecology-japan-context-management-matched.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  management-matched:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - name: Synthetic exact matching and leakage checks
        run: python scripts/ecology_japan_context_management_matched.py --self-test
      - name: Download fixed source A
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Reproduce PR82 and run management-matched controls
        run: python scripts/ecology_japan_context_management_matched.py --archive tmp/private/old.zip --output tmp/context-management-matched.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: context-management-matched-aggregate-only
          path: tmp/context-management-matched.json
          if-no-files-found: error
          retention-days: 14
