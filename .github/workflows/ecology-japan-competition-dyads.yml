name: "Horse repeated competition dyad residual research"
on:
  push:
    branches: [analysis/horse-dyad-competition-20261126]
    paths:
      - "scripts/ecology_japan_competition_dyads.py"
      - "docs/research/JAPAN_COMPETITION_DYADS_PROTOCOL_20261126.md"
      - ".github/workflows/ecology-japan-competition-dyads.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dyad:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - name: Synthetic dyad gates
        run: python scripts/ecology_japan_competition_dyads.py --self-test
      - name: Acquire pinned historical archive
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python -c "from pathlib import Path; from ecology_japan_archive_forward import download; download(Path('tmp/private/old.zip'))"
      - name: Real chronological competitive dyad correspondence
        run: python scripts/ecology_japan_competition_dyads.py --archive tmp/private/old.zip --output tmp/competition-dyads.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competition-dyads-aggregate-only
          path: tmp/competition-dyads.json
          if-no-files-found: error
          retention-days: 14
