name: "Ecology: prelocked Doomben 2025/2026 150m-200m marker bridge"

# 23 exactly date-locked original 2025 Doomben CSVs, first/last per month.
# Previously fixed 19 original 2026 Doomben meetings remain UNCHANGED.
# This is post-hoc measurement feasibility following insufficient
# repeat animal support, NOT biological H1 or H2.
on:
  push:
    branches:
      - research/ecological-reaction-norms
    paths:
      - 'docs/ecology-rq-doomben-2025-marker-calendar-lock.md'
      - 'scripts/ecology_rq_doomben_2025_marker_extension.py'
      - 'tests/test_ecology_rq_doomben_2025_marker_extension.py'
      - '.github/workflows/ecology-rq-doomben-2025-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-original-2025-plus-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install original race-FE Gaussian variance model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2'
      - name: Validate strictly fictional source aliases, missing dates and marker HOLDs
        run: python -m unittest discover -s tests -p 'test_ecology_rq_doomben_2025_marker_extension.py' -v
      - name: Evaluate 23 new source-locked Doomben 2025 dates and unchanged 19 from 2026
        run: |
          python scripts/ecology_rq_doomben_2025_marker_extension.py \
            --output tmp/rq-doomben-2025-plus-2026-first-marker-source-readiness.json
          python - <<'PY'
          import json
          from pathlib import Path
          file=Path('tmp/rq-doomben-2025-plus-2026-first-marker-source-readiness.json')
          r=json.loads(file.read_text())
          assert r['status'] in (
              'POSTHOC_DOOMBEN_2025_2026_FIRST_MARKER_SOURCE_FEASIBILITY_PARTIAL_HOLD',
              'POSTHOC_DOOMBEN_2025_2026_FIRST_MARKER_SOURCE_FEASIBILITY_COMPLETE')
          l=r['locked_source_design']
          assert len(l['selected_2025_original_CSV_dates'])==23
          assert len(l['previous_2026_Doomben_dates_unchanged'])==19
          assert not r['H1_ground_individual_reaction_norm_estimated']
          assert not r['H2_opponent_competition_social_effect_estimated']
          assert r['no_source_HORSES_ID_names_rider_trainer_licences_or_raw_GPS_published']
          for key in ('2025_ONLY_first_marker_source_models','2025_AND_2026_first_marker_source_models'):
              m=r[key]
              assert m['individual_original_data_exported'] is False
              if m['status'].startswith('HOLD_'):
                  continue
              assert set(m['first_marker_race_FE_Gaussian_horse_ICC'])=={'150.0','200.0'}
              for x in m['first_marker_race_FE_Gaussian_horse_ICC'].values():
                  if x['status'].startswith('HOLD_'):
                      assert 'conditional_observational_ICC_point_estimate' not in x
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-doomben-2025-2026-marker-readiness-aggregates-only
          path: tmp/rq-doomben-2025-plus-2026-first-marker-source-readiness.json
          retention-days: 30
