name: Private multi-race WIN/WIDE next-market preseal pipeline and R8 replay

on:
  push:
    branches: [analysis/private-multirace-winwide-preseal-20261025]
    paths:
      - 'scripts/keiba_private_multirace_winwide_shadow.py'
      - 'scripts/keiba_private_forward_r8_replay.py'
      - 'tests/test_keiba_private_multirace_winwide_shadow.py'
      - 'docs/betting/private-winwide-next-market-multirace-20261025.md'
      - '.github/workflows/keiba-private-next-market-multirace.yml'
  pull_request:
    paths:
      - 'scripts/keiba_private_multirace_winwide_shadow.py'
      - 'scripts/keiba_private_forward_r8_replay.py'
      - 'tests/test_keiba_private_multirace_winwide_shadow.py'
      - 'docs/betting/private-winwide-next-market-multirace-20261025.md'
      - '.github/workflows/keiba-private-next-market-multirace.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-and-private-model-firewall:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NumPy physical simulation dependency
        run: python -m pip install 'numpy>=1.26,<3'
      - name: Test local SHA freeze, sealed source clocks, window selection, no leak, optional horse history and cohort identity
        run: |
          python -m compileall -q scripts/keiba_private_multirace_winwide_shadow.py scripts/keiba_private_forward_r8_replay.py tests/test_keiba_private_multirace_winwide_shadow.py
          python -m unittest discover -s tests -p 'test_keiba_private_multirace_winwide_shadow.py' -v
      - name: Historical Kyoto8 3-quote source replay, NEVER an authenticated pre-race event
        run: |
          python scripts/keiba_private_forward_r8_replay.py --horse-draws 120 --output tmp/private-kyoto8-historic-engineering-replay.json
          python -c "import json; x=json.load(open('tmp/private-kyoto8-historic-engineering-replay.json')); assert x['status'].startswith('ONE_ARCHIVED_R8_ENGINEERING_REPLAY') and x['actual_source_races']==1 and x['real_future_after_freeze_event_count']==0; assert x['n_market_models']==12; s=x['scores']; assert abs(s['mid_WIN_persistence']['next_price_index_TV_pp']-9.656362948215287)<1e-8 and abs(s['mid_WIN_momentum']['next_price_index_TV_pp']-8.180965354937559)<1e-8 and abs(s['mid_WIN_momentum_plus_WIDE_node_beta025']['next_price_index_TV_pp']-7.104113542634069)<1e-8; assert not x['synthetic_duplicate_cohort']['prospective_evaluation_certified']"
      - name: Report only score summary and fail-closed forward-proof status
        run: |
          python -c "import json; x=json.load(open('tmp/private-kyoto8-historic-engineering-replay.json')); print('LOCAL_ONLY_R8_NEXT_QUOTE_SOURCE_TEST',json.dumps(x['scores'],ensure_ascii=False,sort_keys=True)); print('COHORT_NOT_PROSPECTIVE',json.dumps({k:v for k,v in x['synthetic_duplicate_cohort'].items() if k!='by_prespecified_model'},sort_keys=True)); assert x['original_model_did_not_exist_in_authentic_2026_10_12_seal']"
      - uses: actions/upload-artifact@v4
        with:
          name: private-market-multirace-historical-replay-aggregate-only
          path: tmp/private-kyoto8-historic-engineering-replay.json
          retention-days: 14
