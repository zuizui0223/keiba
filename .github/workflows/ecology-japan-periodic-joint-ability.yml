name: "Horse monthly joint ability and curvature bounds"
on:
  push:
    branches: [analysis/horse-periodic-joint-ability-20261126]
    paths:
      - "scripts/ecology_japan_periodic_joint_ability.py"
      - "docs/research/JAPAN_PERIODIC_JOINT_ABILITY_PROTOCOL_20261126.md"
      - ".github/workflows/ecology-japan-periodic-joint-ability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  occupancy-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Synthetic indirect joint comparison and curvature bounds
        run: python scripts/ecology_japan_periodic_joint_ability.py --self-test
      - name: Download fixed source A
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Run monthly joint graph and original daily parity
        run: python scripts/ecology_japan_periodic_joint_ability.py --archive tmp/private/old.zip --receipt docs/evidence/japan-daily-ability-20261126.json --output tmp/periodic-joint-ability.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: periodic-joint-ability-aggregate-only
          path: tmp/periodic-joint-ability.json
          if-no-files-found: error
          retention-days: 14
