name: Betting ABM-PDE synthetic QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/betting_abm_pde_sensitivity.py'
      - 'docs/evidence/betting-20261018-official-top3-postrace.json'
      - 'tests/test_betting_abm_pde_postrace.py'
      - 'scripts/betting_abm_pde_particle_bridge.py'
      - 'scripts/betting_abm_pde_postrace_audit.py'
      - 'tests/test_betting_abm_pde_sensitivity.py'
      - 'docs/betting/abm-pde-win-place-sensitivity-20261023.md'
      - '.github/workflows/betting-abm-pde-tests.yml'
  pull_request:
    paths:
      - 'scripts/betting_abm_pde_sensitivity.py'
      - 'docs/evidence/betting-20261018-official-top3-postrace.json'
      - 'tests/test_betting_abm_pde_postrace.py'
      - 'scripts/betting_abm_pde_particle_bridge.py'
      - 'scripts/betting_abm_pde_postrace_audit.py'
      - 'tests/test_betting_abm_pde_sensitivity.py'
      - 'docs/betting/abm-pde-win-place-sensitivity-20261023.md'
      - '.github/workflows/betting-abm-pde-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-sensitivity-tests:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: PL mass, deterministic ABM, paired Monte Carlo, PDE conservation and input-source gates
        run: python -m unittest discover -s tests -p 'test_betting_abm_pde*.py' -v
      - name: Verify a complete 17-horse 10k-draw synthetic Kyoto sample
        run: |
          python scripts/betting_abm_pde_sensitivity.py --venue 京都 --race 11 --runs 10000 --seed 20261023 --output tmp/abm-shuka
          python -c "import json; r=json.load(open('tmp/abm-shuka/summary.json')); assert r['selected_races']==1; assert r['races'][0]['n_horses']==17; assert abs(r['pde']['total_mass']-1)<1e-10; assert r['pde']['l1_error_against_gaussian']<0.025"
      - name: Smoke-test every archived race, without changing v3.1 data
        run: |
          python scripts/betting_abm_pde_sensitivity.py --all-races --runs 1000 --seed 20261023 --output tmp/abm-all-nine
          python -c "import json,csv; x=json.load(open('tmp/abm-all-nine/summary.json')); rows=list(csv.DictReader(open('tmp/abm-all-nine/horses.csv',encoding='utf-8-sig'))); assert len(x['races'])==9 and len(rows)==117 and all(r['status'].startswith('SYNTHETIC') for r in x['races'])"
      - name: JRA official podium source locked / market-only 9-race retrospective audit
        run: |
          python scripts/betting_abm_pde_postrace_audit.py --market-only --output tmp/abm-postrace-market.json
          python -c "import json; x=json.load(open('tmp/abm-postrace-market.json')); a=x['overall_mean_by_model']; assert x['race_count']==9 and x['total_horse_entries']==117; assert x['market_odds_top3_hits_of_total']['hits']==17; assert abs(a['market_PL']['winner_log_loss']-1.911876143)<1e-6; assert abs(a['market_PL']['top3_binary_brier_mean_horse']-0.1364333775)<1e-6"
      - name: Postrace score the unchanged synthetic scenarios; no outcome-based fitting
        run: python scripts/betting_abm_pde_postrace_audit.py --runs 1000 --output tmp/abm-postrace-allmodels.json
      - name: Numerical particle-ABM to advection-diffusion PDE consistency
        run: |
          python scripts/betting_abm_pde_particle_bridge.py --particles 20000 --output tmp/abm-pde-particle-bridge.json
          python -c "import json; v=json.load(open('tmp/abm-pde-particle-bridge.json')); assert abs(v['pde_mass']-1)<1e-10 and v['out_of_domain_particles']==0 and v['kolmogorov_cdf_error']<0.03; assert v['pde_nonnegative']; assert v['status'].startswith('SYNTHETIC')"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-abm-pde-qa-output
          path: |
            tmp/abm-shuka
            tmp/abm-all-nine
            tmp/abm-postrace-market.json
            tmp/abm-postrace-allmodels.json
            tmp/abm-pde-particle-bridge.json
          retention-days: 7
