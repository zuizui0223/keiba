name: "Context information manuscript figures"
on:
  push:
    branches: [analysis/integrated-context-information-20261124]
    paths:
      - "scripts/render_context_information_figures.mjs"
      - "docs/research/figures/context-information/**"
      - ".github/workflows/ecology-context-information-figures.yml"
  pull_request:
    paths:
      - "scripts/render_context_information_figures.mjs"
      - "docs/research/figures/context-information/**"
      - ".github/workflows/ecology-context-information-figures.yml"
permissions:
  contents: read
jobs:
  aggregate-figures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/render_context_information_figures.mjs --check
