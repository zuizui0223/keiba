name: "Japan 2022-24 strict race denominator and family-history audit"
on:
  push:
    branches: [analysis/japan-independent-2022-anchor-gate-20261115]
    paths:
      - ".github/workflows/ecology-japan-2022-denominator-audit.yml"
      - "scripts/ecology_japan_2022_denominator_audit.py"
      - "tests/test_ecology_japan_2022_denominator_audit.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-identity-denominator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fixed source-analysis dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.2.6 'huggingface_hub>=0.30' 'hf_xet>=1.0'
      - name: Unit tests for complete/tied/gapped/unknown denominators
        run: |
          PYTHONPATH=scripts python -m unittest discover -s tests -p "test_ecology_japan_2022_denominator_audit.py" -v
          PYTHONPATH=scripts python -m unittest discover -s tests -p "test_ecology_japan_2022_independent_forward.py" -v
      - name: Download source A transiently
        run: |
          mkdir -p tmp/private
          PYTHONPATH=scripts python -c "from pathlib import Path; from ecology_japan_archive_forward import download; download(Path('tmp/private/old.zip'))"
      - name: Download locked independent source B transiently
        run: |
          python - <<'PY'
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          p=Path(hf_hub_download(repo_id="KBlueLeaf/jp-racing-horse",
               repo_type="dataset",filename="all_races_1990-2025.db",local_dir="tmp/private"))
          assert p.is_file() and p.stat().st_size>0
          PY
      - name: Independently verify race horse ID, rank and complete-race denominator
        run: |
          PYTHONPATH=scripts python scripts/ecology_japan_2022_denominator_audit.py \
            --archive tmp/private/old.zip \
            --sqlite tmp/private/all_races_1990-2025.db \
            --output tmp/japan-2022-2024-denominator-aggregate.json
      - name: Verify fail-closed denominator status and disclosure
        run: |
          python - <<'PY'
          import json
          p="tmp/japan-2022-2024-denominator-aggregate.json"
          j=json.load(open(p,encoding="utf-8"))
          assert j["status"] in {
             "REAL_SOURCE_2022_2024_RACE_HORSES_DENOMINATOR_AUDIT_NOT_GENETIC_CAUSATION",
             "HOLD_NO_STRICT_COMPLETE_RACE_ROWS"
          }
          assert j["original_frozen"]["rows"]==255484
          assert j["original_frozen"]["unique_horses"]==12919
          assert j["no_raw_horse_or_race_records_exported"]
          print("DENOMINATOR_SOURCE_QA_STATUS",j["status"])
          PY
      - name: Remove third-party original bytes
        if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: japan-2022-24-denominator-audit-aggregate-only
          path: tmp/japan-2022-2024-denominator-aggregate.json
          if-no-files-found: warn
          retention-days: 14
