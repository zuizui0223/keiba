name: Ecological research QA

on:
  push:
    branches:
      - research/ecological-reaction-norms
  pull_request:
    paths:
      - 'scripts/ecology_*'
      - 'tests/test_ecology_*'
      - 'docs/ecology-*'
      - '.github/workflows/ecology-tests.yml'

permissions:
  contents: read

jobs:
  panel-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pilot model dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'pandas>=2,<3' 'scipy>=1.11,<2' 'statsmodels>=0.14,<0.15'
      - name: Validate temporal provenance and research gates
        run: python -m unittest discover -s tests -p 'test_ecology_*.py' -v
      - name: End-to-end synthetic pipeline (no empirical claims)
        run: |
          python scripts/ecology_demo_data.py --output tmp/fabricated.csv --days 26 --horses 16
          python scripts/ecology_panel.py --input tmp/fabricated.csv --audit tmp/readiness.json --features tmp/lagged.csv
          python scripts/ecology_h1_pilot.py --input tmp/fabricated.csv --output tmp/h1.json --surface turf --permit-synthetic-demo
          python -c "import json; a=json.load(open('tmp/readiness.json')); b=json.load(open('tmp/h1.json')); assert a['status']=='SYNTHETIC_ONLY'; assert b['status']=='SYNTHETIC_SMOKE_ONLY'; assert b['within_between']['individual_exposure_baseline_computed_from_training_only']"
      - name: End-to-end H2 changing-field simulation (never actual results)
        run: |
          python scripts/ecology_demo_competitors.py --output tmp/fake-competitors.csv --days 65 --horses 36 --runners 12 --seed 512
          python scripts/ecology_panel.py --input tmp/fake-competitors.csv --audit tmp/h2-readiness.json --features tmp/h2-lagged.csv
          python scripts/ecology_h2_pilot.py --input tmp/fake-competitors.csv --output tmp/h2-demo.json --surface turf --permit-synthetic-demo
          python -c "import json; a=json.load(open('tmp/h2-readiness.json')); b=json.load(open('tmp/h2-demo.json')); assert a['status']=='SYNTHETIC_ONLY'; assert b['status']=='SYNTHETIC_H2_SMOKE_ONLY'; assert b['h2_overlap']['training_horses_with_4plus_distinct_context_exposures']>=8; assert b['m0']['converged'] and b['m1']['converged']"
      - name: H2 within-horse model and negative-control stress suite (fabricated only)
        run: |
          python scripts/ecology_h2_within_between.py --input tmp/fake-competitors.csv --output tmp/h2-within.json --surface turf --permit-synthetic-demo
          python scripts/ecology_h2_falsification.py --output tmp/h2-null-stress.json --seeds 512 911 --days 65 --horses 36 --runners 12
          python -c "import json; p=json.load(open('tmp/h2-within.json')); n=json.load(open('tmp/h2-null-stress.json')); assert p['status']=='SYNTHETIC_H2_WITHIN_HORSE_DEMO_ONLY'; assert n['status']=='SYNTHETIC_DESIGN_STRESS_ONLY'; assert len(n['runs'])==6"
      - name: Absolute focal speed with crossed horse-race effects and negative controls
        run: |
          python scripts/ecology_h2_absolute_speed.py --input tmp/fake-competitors.csv --output tmp/h2-raw-speed.json --surface turf --permit-synthetic-demo
          python scripts/ecology_h2_absolute_stress.py --output tmp/h2-raw-speed-stress.json --seeds 512 911
          python -c "import json; x=json.load(open('tmp/h2-raw-speed.json')); y=json.load(open('tmp/h2-raw-speed-stress.json')); assert x['status']=='SYNTHETIC_ABSOLUTE_SPEED_H2_DEMO_ONLY'; assert y['status']=='SYNTHETIC_ABSOLUTE_SPEED_STRESS_ONLY'; assert x['relative_outcome_avoided_in_training'] and len(y['trials'])==6"
      - name: Nonfinishing and missing-speed sensitivity (fictional cases)
        run: |
          python scripts/ecology_h2_outcome_loss_stress.py --output tmp/h2-outcome-loss-stress.json --seed 512
          python -c "import json; x=json.load(open('tmp/h2-outcome-loss-stress.json')); assert x['status']=='SYNTHETIC_MISSINGNESS_FALSIFICATION_ONLY'; assert x['scenarios']['none']['nonfinisher_count']==0; assert x['scenarios']['speed_dependent']['nonfinisher_count']>0; assert x['no_empirical_horse_claims']"
      - name: Two-part competition outcome (finish versus speed) and HK schema preflight
        run: |
          python scripts/ecology_demo_completion.py --output tmp/fictional-with-DNF.csv --days 100 --horses 48 --runners 12 --seed 512 --loss random
          python scripts/ecology_h2_two_part.py --input tmp/fictional-with-DNF.csv --output tmp/h2-two-part.json --surface turf --permit-synthetic-demo
          python -c "import json; p=json.load(open('tmp/h2-two-part.json')); assert p['status']=='SYNTHETIC_TWO_PART_H2_DEMO_ONLY'; assert p['date_split']['training_DNF']>=12 and p['date_split']['future_DNF']>=3; assert p['part_B_speed_conditional_on_timed_finish']['never_impute_a_nonfinisher_full_distance_speed']"
