name: Ecological research QA

on:
  push:
    branches:
      - research/ecological-reaction-norms
  pull_request:
    paths:
      - 'scripts/ecology_*'
      - 'tests/test_ecology_*'
      - 'docs/ecology-*'
      - '.github/workflows/ecology-tests.yml'

permissions:
  contents: read

jobs:
  panel-audit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate temporal provenance and research gates
        run: python -m unittest discover -s tests -p 'test_ecology_*.py' -v
