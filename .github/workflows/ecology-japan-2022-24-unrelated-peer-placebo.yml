name: "Japan 2022-24 unrelated-peer placebo with exact PR70-73 parity"

on:
  push:
    branches: [analysis/2022-24-unrelated-peer-placebo-20261122]
    paths:
      - ".github/workflows/ecology-japan-2022-24-unrelated-peer-placebo.yml"
      - "scripts/ecology_japan_unrelated_peer_control.py"
      - "scripts/ecology_japan_2022_24_peer_identity_placebo.py"
      - "tests/test_ecology_japan_unrelated_peer_control.py"
      - "tests/test_ecology_japan_2022_24_peer_identity_placebo.py"
      - "docs/research/JAPAN_2022_24_UNRELATED_PEER_PLACEBO_PROTOCOL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-source-unrelated-peer-placebo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned scientific stack
        run: python -m pip install numpy==2.2.6 pandas==2.2.3
      - name: Validate independent placebo oracle, paired losses and unchanged parent engines
        run: |
          python -m unittest discover -s tests -p 'test_ecology_japan_unrelated_peer_control.py' -v
          python -m unittest discover -s tests -p 'test_ecology_japan_2022_24_peer_identity_placebo.py' -v
          python -m unittest discover -s tests -p 'test_ecology_japan_balanced_parent_history.py' -v
          python -m unittest discover -s tests -p 'test_ecology_japan_2022_24_equal_peer_information.py' -v
          python -m unittest discover -s tests -p 'test_ecology_japan_2022_24_parent_performance_channels.py' -v
      - name: Download SHA-locked originals into disposable private runner
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.request import Request, urlopen
          from ecology_japan_archive_forward import download
          from ecology_japan_2022_parent_placebo import SQLITE_SHA
          download(Path('tmp/private/old.zip'))
          url = ('https://huggingface.co/datasets/KBlueLeaf/jp-racing-horse/resolve/'
                 '7bad21b3be3eba550f262abcf4e682a94cb85d4d/all_races_1990-2025.db')
          target = Path('tmp/private/all_races_1990-2025.db')
          h = hashlib.sha256()
          size = 0
          with urlopen(Request(url, headers={'User-Agent': 'keiba-research/1.0'}), timeout=120) as r, target.open('wb') as f:
              while chunk := r.read(8 * 1024 * 1024):
                  size += len(chunk)
                  if size > 1_100_000_000:
                      raise ValueError('HOLD_SOURCE_B_SIZE')
                  h.update(chunk)
                  f.write(chunk)
          if h.hexdigest() != SQLITE_SHA:
              raise ValueError('HOLD_SOURCE_B_SHA')
          target.chmod(0o600)
          print('SOURCE_A_AND_SOURCE_B_EXACT_SHA_VERIFIED')
          PY
      - name: Reproduce prior three studies before running source-matched non-kin null
        run: |
          python scripts/ecology_japan_2022_24_peer_identity_placebo.py \
            --archive tmp/private/old.zip \
            --sqlite tmp/private/all_races_1990-2025.db \
            --output tmp/japan-2022-24-unrelated-peer-placebo-aggregate.json
      - name: Destroy all original third-party records
        if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: japan-2022-24-unrelated-peer-placebo-aggregate-only
          path: tmp/japan-2022-24-unrelated-peer-placebo-aggregate.json
          if-no-files-found: error
          retention-days: 14
