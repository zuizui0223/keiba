name: "Horse common ability scale via opponent network"
on:
  push:
    branches: [analysis/horse-common-ability-scale-20261126]
    paths:
      - "scripts/ecology_japan_common_ability.py"
      - "docs/research/JAPAN_COMMON_ABILITY_PROTOCOL_20261126.md"
      - ".github/workflows/ecology-japan-common-ability.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  occupancy-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3
      - name: Synthetic graph identifiability and chronology
        run: python scripts/ecology_japan_common_ability.py --self-test
      - name: Download fixed source A
        run: |
          mkdir -p tmp/private
          chmod 700 tmp/private
          PYTHONPATH=scripts python - <<'PY'
          from pathlib import Path
          from ecology_japan_archive_forward import download
          download(Path('tmp/private/old.zip'))
          PY
      - name: Run historical opponent-network ability and first-meeting evaluation
        run: python scripts/ecology_japan_common_ability.py --archive tmp/private/old.zip --output tmp/common-ability.json
      - if: always()
        run: rm -rf tmp/private
      - uses: actions/upload-artifact@v4
        with:
          name: common-ability-aggregate-only
          path: tmp/common-ability.json
          if-no-files-found: error
          retention-days: 14
