name: Nonlocal horse ABM PDE bettor integrated audit

on:
  push:
    branches: [analysis/coupled-nonlocal-horse-pde-bettor-20261025]
    paths:
      - 'scripts/keiba_nonlocal_horse_pde_bettor_bridge.py'
      - 'tests/test_keiba_nonlocal_horse_pde_bettor_bridge.py'
      - 'docs/betting/nonlocal-horse-pde-bettor-20261025.md'
      - '.github/workflows/keiba-nonlocal-horse-pde-bettor.yml'
  pull_request:
    paths:
      - 'scripts/keiba_nonlocal_horse_pde_bettor_bridge.py'
      - 'tests/test_keiba_nonlocal_horse_pde_bettor_bridge.py'
      - 'docs/betting/nonlocal-horse-pde-bettor-20261025.md'
      - '.github/workflows/keiba-nonlocal-horse-pde-bettor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-to-voter-source-locked:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Physical kernel identical for horse particles and finite-horse marginal PDE
        run: |
          python -m compileall -q scripts/keiba_nonlocal_horse_pde_bettor_bridge.py tests/test_keiba_nonlocal_horse_pde_bettor_bridge.py
          python -m unittest discover -s tests -p 'test_keiba_nonlocal_horse_pde_bettor_bridge.py' -v
      - name: Historical source-locked six-race physical-to-voter audit
        run: |
          python scripts/keiba_nonlocal_horse_pde_bettor_bridge.py --draws 350 --pde-particles 1500 --output tmp/nonlocal-coupled-audit.json
          python -c "import json; q=json.load(open('tmp/nonlocal-coupled-audit.json')); assert q['official_races']==6 and q['meeting_dates']==2 and q['horse_race_entries']==84 and q['JRA_history_retrospectively_retrieved_not_asof_attested'] and q['real_successful_forward_threshold_or_bet_EV']=='HOLD'; assert abs(q['baseline_observed_later_WIN_M0']['win_log_loss']-1.696959293802405)<1e-7; assert all(abs(z['pde_mass_min']-1)<1e-8 and abs(z['pde_mass_max']-1)<1e-8 for z in q['nonlocal_particle_PDE_diagnostics'].values())"
      - name: Report causal contrast, density closure, market agreement and outcome score separately
        run: |
          python -c "import json; q=json.load(open('tmp/nonlocal-coupled-audit.json')); print('HORSE_INTERACTING_PDE',json.dumps(q['nonlocal_particle_PDE_diagnostics'],sort_keys=True)); print('HORSE_TO_BETTOR_WIN_LOSS',json.dumps({a:{c:{m:v['win_log_loss'] for m,v in z.items()} for c,z in x.items()} for a,x in q['mean_race_equal_scores'].items()},sort_keys=True)); print('HORSE_TO_BETTOR_MARKET_TV',json.dumps(q['market_index_TV_to_real_later'],sort_keys=True)); print('HORSE_TO_BETTOR_TIME_STRATA',json.dumps(q['by_meeting_date'],sort_keys=True)); print('EMPIRICAL_STATUS',q['real_successful_forward_threshold_or_bet_EV'])"
      - uses: actions/upload-artifact@v4
        with:
          name: horse-nonlocal-pde-bettor-aggregates-hold-only
          path: tmp/nonlocal-coupled-audit.json
          retention-days: 14
