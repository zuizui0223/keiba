name: "Ecological official horse-ID single-race feasibility"

# Exactly one vetted historical meeting and one official race:
# official date -> meeting ID -> race ID -> HORSES list -> GPS name check.
# Privacy: publish only aggregated field names/counts, never horse data.
on:
  push:
    branches:
      - research/ecological-reaction-norms
    paths:
      - 'scripts/ecology_rq_single_race_id_probe.py'
      - 'tests/test_ecology_rq_single_race_id_probe.py'
      - '.github/workflows/ecology-rq-single-race-id.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-readonly-id-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fictional identity schemas only
        run: python -m unittest discover -s tests -p 'test_ecology_rq_single_race_id_probe.py' -v
      - name: One real RQ meeting/race chain, no runner-level artifacts
        run: |
          python scripts/ecology_rq_single_race_id_probe.py --date 2026-10-11 --output tmp/rq-single-race-id-aggregate.json
          python -c "import json; a=json.load(open('tmp/rq-single-race-id-aggregate.json')); assert a['status']=='HOLD_RQ_OFFICIAL_ID_CROSSWALK_NOT_COMPLETE'; assert not a['any_raw_names_or_horse_ids_output']; assert not a['H1_real_horse_effect_supported']; assert a['api']['meeting']['meeting_id_found_and_validated']; assert a['api']['race']['race_id_found_and_validated']"
      - uses: actions/upload-artifact@v4
        with:
          name: official-single-race-id-audit-aggregate-only
          path: tmp/rq-single-race-id-aggregate.json
          retention-days: 30
